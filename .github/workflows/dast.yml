name: DAST

on:
  pull_request:
    branches:
      - main

jobs:
  dast:
    name: OWASP ZAP BASELINE SCAN
    runs-on: ubuntu-latest
    permissions:
          # actions: write
          # attestations: write
          # checks: write
          # contents: write
          # deployments: write
          # id-token: write
          issues: write
          # models: read
          # discussions: write
          # packages: write
          # pages: write
          # pull-requests: write
          # security-events: write
          # statuses: write
    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}

    steps:
      - uses: actions/checkout@v2
        with:
          ref: fixes
      - name: Building Docker Insecure Acebook Image
        run: docker build --tag insecure-acebook:latest .
      - name: Launching the Insecure Acebook app
        run: docker run -d -p 5000:5000 insecure-acebook

      - name: OWASP ZAP
        ### Swap the actions used if you want a more comprehensive DAST analysis of your app :)
        # uses: zaproxy/action-full-scan@v0.3.0
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://127.0.0.1:5000"
          fail_action: false
          token: ${{ secrets.GITHUB_TOKEN }}
          issue_title: DAST Security Tests
          docker_name: "ghcr.io/zaproxy/zaproxy:stable"


